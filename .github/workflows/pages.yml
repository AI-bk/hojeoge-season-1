name: Deploy site to GitHub Pages

# 커밋할 때마다 배포하면 배포가 몰려 실패가 잦아서, 하루 한 번 모아서 손으로(workflow_dispatch) 배포한다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# 2026-11-22: 올리기와 배포를 한 작업에서 이어 하면, 배포 단계가 방금 올린 묶음을 아직 못 찾아 실패하곤 했다.
# 그래서 build(검사·올리기)와 deploy(배포)를 따로 나눈다. 배포만 실패하면 deploy 작업만 다시 실행하면 된다.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run story tests
        run: |
          node tests/seasons-1-and-2.cjs
          node tests/season-3.cjs
          node tests/season-4.cjs
          node tests/i18n.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
